global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'saiv-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # Module 3 (face-recognition) does not expose /metrics yet; add a job for
  # face-recognition:8001 here once it does, or the target shows as "down".

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
