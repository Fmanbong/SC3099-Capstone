services:
  # ==========================================================================
  # Infrastructure Services
  # ==========================================================================

  postgres:
    image: postgres:15-alpine
    container_name: saiv-postgres
    environment:
      POSTGRES_USER: saiv
      POSTGRES_PASSWORD: saiv_password
      POSTGRES_DB: saiv
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saiv"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saiv-network

  redis:
    image: redis:7-alpine
    container_name: saiv-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saiv-network

  # ==========================================================================
  # Application Services (Students implement these)
  # ==========================================================================

  backend:
    build:
      context: ./module2-backend
      dockerfile: Dockerfile
    container_name: saiv-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://saiv:saiv_password@postgres:5432/saiv
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PUBLIC_TEST_MODE: ${PUBLIC_TEST_MODE:-false}
      # auto = staff approve face enrollments, except in PUBLIC_TEST_MODE (spec behaviour)
      FACE_ENROLLMENT_APPROVAL: ${FACE_ENROLLMENT_APPROVAL:-auto}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:8501"]}
      FACE_SERVICE_URL: http://face-recognition:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # Same as the Dockerfile CMD, except that a missing SECRET_KEY falls back to a
    # random per-start secret instead of refusing to boot. Set SECRET_KEY in the
    # root .env (see .env.example) so logins survive backend restarts.
    command:
      - sh
      - -c
      - >-
        export SECRET_KEY="$${SECRET_KEY:-$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')}"
        && alembic upgrade head
        && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      face-recognition:
        condition: service_started
    networks:
      - saiv-network

  face-recognition:
    build:
      context: ./module3-face-recognition
      dockerfile: Dockerfile
    container_name: saiv-face-recognition
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - saiv-network

  frontend:
    build:
      context: ./module1-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_FACE_SERVICE_URL: http://localhost:8001
    container_name: saiv-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_FACE_SERVICE_URL: http://localhost:8001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - saiv-network

  dashboard:
    build:
      context: ./module4-observability
      dockerfile: Dockerfile
    container_name: saiv-dashboard
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://saiv:saiv_password@postgres:5432/saiv
      BACKEND_URL: http://backend:8000
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://localhost:3001
    depends_on:
      backend:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - saiv-network

  # ==========================================================================
  # Observability Services
  # ==========================================================================

  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: saiv-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./module4-observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - saiv-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: saiv-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./module4-observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - saiv-network

  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    container_name: saiv-otel-collector
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
    volumes:
      - ./module4-observability/otel-collector-config.yml:/etc/otel/config.yaml
    command: ["--config=/etc/otel/config.yaml"]
    networks:
      - saiv-network

networks:
  saiv-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
